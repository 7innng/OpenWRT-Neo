# SPDX-License-Identifier: MIT
name: CR6606

on:
  workflow_dispatch:
    inputs:
      PACKAGE:
        description: '额外调整插件包，多个请用换行分隔。'
        required: false
        type: string
      TEST:
        description: '仅输出配置文件，不编译固件。'
        default: false
        required: false
        type: boolean

permissions: write-all

jobs:
  config:
    name: CR6606
    uses: ./.github/workflows/WRT-CORE.yml
    with:
      WRT_CONFIG: CR6606-WIFI-YES
      WRT_THEME: aurora
      WRT_NAME: OWRT
      WRT_SSID: OWRT
      WRT_WORD: '12345678'
      WRT_IP: 192.168.10.1
      WRT_PW: 无
      WRT_REPO: https://github.com/VIKINGYFY/immortalwrt.git
      WRT_BRANCH: owrt
      WRT_SOURCE: VIKINGYFY/immortalwrt
      WRT_PACKAGE: |
        CONFIG_PACKAGE_luci-app-homeproxy=n
        CONFIG_PACKAGE_luci-app-openclash=y
        ${{ inputs.PACKAGE }}
      WRT_TEST: ${{ inputs.TEST }}
